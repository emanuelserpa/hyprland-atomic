---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: hyprland-atomic
description: Emanuel's personal Atomic Hyprland desktop, based on Wayblue.

base-image: ghcr.io/wayblueorg/hyprland
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /

  # Keep a working default shell in the image. A user's ~/.config/quickshell
  # still takes precedence, so the same files remain overrideable as dotfiles.
  - type: copy
    src: dotfiles/.config/quickshell
    dest: /etc/xdg/quickshell/

  # Seed user-scoped configs on first graphical login without overwriting
  # existing files (including yadm-managed settings).
  - type: copy
    src: dotfiles/
    dest: /usr/share/hyprland-atomic/defaults/

  - type: script
    scripts:
      - import-insync-key.sh

  - type: dnf
    repos:
      copr:
        - lionheartp/Hyprland
    install:
      install-weak-deps: false
      packages:
        - curl
        - gh
        - git
        - gnupg2
        - kitty
        - openssh-clients
        - quickshell
        - python3-pillow
        - awww
        - waypaper
        - nemo
        - rofimoji
        - swappy
        - qt6ct
        - kvantum
        - neovim
        - zsh
        - mpv
        - yt-dlp
        - htop
        - glances
        - screen
        - google-noto-sans-fonts
        - python3-requests
        - zsh-autosuggestions
        - zsh-syntax-highlighting
        - trash-cli
        - easyeffects
        - thinkfan
        - scx_layered
        - scx_rusty
        - insync

  - type: script
    scripts:
      - install-yadm.sh

  - type: default-flatpaks
    configurations:
      - scope: user
        repo:
          title: Flathub (user)
        install:
          - app.zen_browser.zen

  - type: fonts
    fonts:
      nerd-fonts:
        - Noto

  # This image targets Emanuel's ThinkPad T14 Gen 1 AMD. The files module
  # installs its validated fan curve and thinkpad_acpi fan-control option.
  - type: systemd
    system:
      enabled:
        - thinkfan.service
        - hyprland-atomic-charge-limit.service
    user:
      enabled:
        - hyprland-atomic-user-setup.service
        - quickshell.service

  - type: signing
