# ThinkPad T14 Gen 1 AMD
# Ryzen 5 PRO 4650U
#
# Curva voltada para:
# - silêncio em idle
# - resposta progressiva
# - evitar acúmulo de calor no chassi
# - permitir CPU/GPU trabalhar dinamicamente

sensors:
  - hwmon: /sys/class/hwmon
    name: k10temp
    indices: [1]

fans:
  - tpacpi: /proc/acpi/ibm/fan

levels:
  # Fan completamente desligada até 50 °C.
  - [0,  0, 50]

  # Começa suavemente.
  # Se cair abaixo de 47 °C, volta ao nível anterior.
  - [1, 47, 58]

  # Carga leve / navegador / vídeo.
  - [2, 55, 65]

  # Carga moderada.
  - [3, 62, 72]

  # Começamos a dissipar calor de forma mais séria.
  - [4, 68, 77]

  # Evita que o heatpipe/chassi acumulem calor demais.
  - [5, 72, 80]

  # Carga pesada.
  - [7, 77, 85]

  # Segurança térmica.
  # Acima de ~83 °C não tentamos preservar silêncio.
  - ["level full-speed", 83, 32767]
