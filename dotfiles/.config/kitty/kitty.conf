# Kitty — terminal principal (NotoMono Nerd 11, 75% opaco).
# As cores acompanham o tema Chameleon atual.

font_family NotoMono Nerd Font
font_size 11
background_opacity 0.75
dynamic_background_opacity yes
cursor_shape block
cursor_blink_interval 0
scrollback_lines 10000
copy_on_select no
paste_actions quote-urls-at-prompt
strip_trailing_spaces smart
term xterm-kitty

# Paleta Chameleon atual.
foreground #efdee0
background #191113
selection_foreground #efdee0
selection_background #713342
cursor #ffb1c0
cursor_text_color #191113
color0 #191113
color8 #9f8c8f
color1 #f16460
color9 #f48985
color2 #91c04c
color10 #a4cb6a
color3 #fbbf4f
color11 #fcce77
color4 #629dfd
color12 #8ab6fe
color5 #e886d5
color13 #efa8e1
color6 #48c9ed
color14 #6dd4f1
color7 #d6c2c4
color15 #efdee0

# Não herdar estado maximizado da última janela (kitty lembra até isso).
remember_window_size no

# Ctrl+C copia com seleção e interrompe o programa sem seleção.
map ctrl+c copy_or_interrupt
map ctrl+shift+c copy_to_clipboard
map ctrl+v paste_from_clipboard
