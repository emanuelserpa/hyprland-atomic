general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot

    blur_passes = 3
    blur_size = 5
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.75
    vibrancy = 0.1696
}

# 1. Campo de Senha
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.28
    dots_spacing = 0.15
    dots_center = true
    rounding = -1

    outer_color = rgba(248, 248, 242, 0.4)
    inner_color = rgba(34, 33, 44, 0.9)
    font_color = rgb(248, 248, 242)
    font_family = Noto Sans

    check_color = rgba(235, 255, 135, 1.0)
    fail_color = rgba(255, 149, 128, 1.0)

    fade_on_empty = true
    placeholder_text = <i>Digite a senha...</i>
    fail_text = <i>Senha incorreta<b>($ATTEMPTS)</b></i>

    hide_input = false
    position = 0, -70
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 4
}

# 2. Relógio (Noto Sans em Negrito)
label {
    monitor =
    text = $TIME
    color = rgba(248, 248, 242, 1.0)
    font_size = 90
    font_family = Noto Sans
    position = 0, 140
    halign = center
    valign = center
    shadow_passes = 1
}

# 3. Data por Extenso (Noto Sans)
label {
    monitor =
    text = cmd[update:43200000] date +"%A, %d de %B"
    color = rgba(248, 248, 242, 0.8)
    font_size = 18
    font_family = Noto Sans
    position = 0, 50
    halign = center
    valign = center
}

# 4. Indicador de Bateria Inteligente (Noto Sans + Ícones Corrigidos)
label {
    monitor =
    # O truque aqui é filtrar 'Not charging' antes de 'Charging' para não quebrar o texto
    text = cmd[update:1000] echo "$(cat /sys/class/power_supply/BAT0/capacity)% $(cat /sys/class/power_supply/BAT0/status | sed 's/Not charging/󰚥/ ; s/Discharging/󰂃/ ; s/Charging/󰂄/ ; s/Full/󰁹/')"
    color = rgba(248, 248, 242, 0.8)
    font_size = 14
    font_family = Noto Sans
    position = -30, -20
    halign = right
    valign = top
}

# 5. Autenticação por Biometria
auth {
    fingerprint:enabled = true
    fingerprint:ready_message = "Aguardando digital..."
    fingerprint:present_message = "Toque no sensor de digital"
#    fingerprint:retry_delay = 200
}
